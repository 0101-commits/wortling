# 매일 작업(글 채우기 · 그림 · 뜻 검사)을 깃허브 서버에서 — PC 가 꺼져 있어도 돈다.
# DB 백업은 공개 저장소라 여기서 하지 않는다(PC 작업 「Wortling Backup」, scripts/register-task.ps1).
# 비밀값: APP_URL · API_TOKEN(.env 와 같음) · GEMINI_API_KEY(aistudio.google.com/apikey, 무료 몫) · DISCORD_WEBHOOK_URL
name: daily

on:
  schedule:
    - cron: '17 3 * * *' # 한국 12:17(정각은 깃허브 대기열이 붐벼 늦게 돈다)
  workflow_dispatch:
    inputs:
      recheck:
        description: '이미 올라간 그림 전부 다시 검사(몸 구조·뜻) — 탈락은 다시 그리기 목록 맨 앞'
        type: boolean
        default: false

concurrency: daily

permissions:
  contents: write # .data/restyle.json · images-done.json · draw-day.json · ledger.json(뉴런·검사 AI 사용량 장부) 을 되올린다

jobs:
  # 하루 그리기 몫(무료 Workers AI)은 daily.mjs 가 .data/draw-day.json 으로 날짜(UTC)마다 센다 — 여러 번 돌아도 넘지 않는다.
  # 예전 guard(오늘 성공한 실행이 있으면 예약 실행 건너뜀)는 0장 그린 손 실행에도 걸려 10-19 저녁을 통째로 건너뛰었다
  daily:
    runs-on: windows-latest # 그림 글자 검사가 Windows OCR(scripts/winocr.ps1)
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 트리거 때 커밋이 아니라 지금 main — concurrency 로 기다린 실행이 앞 실행이 되올린 draw-day.json 을 보게.
          # 10-26 손 실행(80번) 뒤 대기하던 예약 실행이 옛 draw-day 로 37번 더 그려 무료 몫을 넘겼고 10-27 그리기가 막혔다
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          check-latest: true
          cache: npm
      # 앱 주소부터 점검(2026-10-30: 배포가 잘못돼 /api/* 가 404 인 채 아래 단계가 줄줄이 실패 → 헷갈리는 디스코드 오류 3건).
      # 고장이면 「앱 주소 고장」 알림 한 번만 보내고 이 작업은 여기서 멈춘다(아래 always() 단계도 health 가 성공일 때만)
      - name: 앱 주소 점검
        id: health
        run: node scripts/verify-deploy.mjs --app
        env:
          APP_URL: ${{ secrets.APP_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - run: npm ci
      - name: daily.mjs
        run: node scripts/daily.mjs --no-backup ${{ inputs.recheck && '--recheck' || '' }}
        env:
          APP_URL: ${{ secrets.APP_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      # 검사에서 떨어진 그림(근거, 장당 수십 KB — scripts/daily.mjs 의 .data/rejected). 폴더가 비면 건너뜀(실패 아님)
      # .data 는 점 폴더라 include-hidden-files 가 있어야 올라간다. 공개 저장소라 git 에는 안 넣는다(.gitignore 의 .data)
      - name: 탈락 그림 보관
        if: always() && steps.health.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rejected-${{ github.run_id }}
          path: .data/rejected
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - name: 그림 상태 되올리기
        if: always() && steps.health.outcome == 'success'
        shell: bash
        # 도는 사이 main 에 커밋이 올라오면 그냥 push 는 거절되고, restyle.json 을 main 에서도 고쳤으면(한 줄 JSON) rebase 는
        # 늘 충돌해 그날 목록이 사라졌다(2026-10-19) → main 을 받아 3-방향으로 합친 뒤(scripts/merge-restyle.mjs)
        # main 위에 두 파일만 커밋. push 가 또 밀리면 세 번까지(그때는 방금 합친 main 이 다음 합치기의 바탕)
        # Windows 러너의 Git Bash 는 「origin/main:.data/…」 같은 인자를 경로로 바꿔 git show 가 실패한다(시뮬레이션 실측) →
        # 경로 바꾸기를 끄고, 커밋은 이름 대신 해시로. main 쪽을 못 읽으면 main 은 안 바뀐 것으로(빈 목록으로 두면 다 지워진다)
        env:
          MSYS_NO_PATHCONV: '1'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          base=$(git rev-parse HEAD)
          for i in 1 2 3; do
            git fetch -q origin main
            main=$(git rev-parse origin/main)
            if [ -f .data/restyle.json ]; then
              git show "$base:.data/restyle.json" > .data/.rs-base.json 2>/dev/null || echo '[]' > .data/.rs-base.json
              git show "$main:.data/restyle.json" > .data/.rs-main.json 2>/dev/null || cp .data/.rs-base.json .data/.rs-main.json
              node scripts/merge-restyle.mjs .data/.rs-base.json .data/.rs-main.json .data/restyle.json
            fi
            git reset -q "$main"
            for f in .data/restyle.json .data/images-done.json .data/draw-day.json .data/ledger.json; do
              if [ -f "$f" ]; then git add -f "$f"; else git rm -q --cached --ignore-unmatch "$f"; fi
            done
            git diff --cached --quiet && exit 0
            git commit -q -m 'chore(daily): 그림 상태 갱신'
            git push -q origin HEAD:main && exit 0
            echo "push 밀림 — 다시 합침($i)"
            base=$main
          done
          exit 1
