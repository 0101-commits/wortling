# 매일 단어 작업(카드 검토 · 뉴스 단어 · 내가 넣은 단어 · 학습 순서)을 깃허브 서버에서 — PC 가 꺼져 있어도 돈다.
# 07:30 아침 알림 전에 오늘 볼 카드를 검토해 두려고 05:17 KST. 그림 작업(daily.yml 12:17)과 안 겹친다.
# 설계 docs/superpowers/specs/2026-10-15-word-review-news-design.md
# 비밀값: APP_URL · API_TOKEN · GEMINI_API_KEY · DISCORD_WEBHOOK_URL (daily.yml 과 같음)
# 색인(.data/words-src/index.json)은 Actions 캐시에 달마다. 공개 저장소라 아무것도 커밋하지 않는다.
name: words

on:
  schedule:
    - cron: '17 20 * * *' # 한국 05:17
  workflow_dispatch:
    inputs:
      dry:
        description: '서버에 쓰지 않고 수만(--dry)'
        type: boolean
        default: false

concurrency: words

permissions:
  contents: read

jobs:
  words:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_URL: ${{ secrets.APP_URL }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      NEWS_FEEDS: ${{ vars.NEWS_FEEDS }} # 저장소 변수 NEWS_FEEDS=0 이면 tagesschau·NDR 을 읽지 않는다
      DRY: ${{ inputs.dry && '--dry' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          check-latest: true
      # 앱 주소부터 점검(2026-10-30: 배포가 잘못돼 /api/* 가 404 인 채 아래 단계가 줄줄이 실패 → 헷갈리는 디스코드 오류 3건).
      # 고장이면 「앱 주소 고장」 알림 한 번만 보내고 이 작업은 여기서 멈춘다(아래 always() 단계도 health 가 성공일 때만)
      - name: 앱 주소 점검
        id: health
        run: node scripts/verify-deploy.mjs --app
      - id: month
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      # 복원과 저장을 나눈다 — actions/cache 하나로는 작업이 실패하면(검토 묶음 하나만 실패해도) 새 색인이 저장되지 않아
      # 다음 날 원본 ≈170MB 를 다시 받았다(최종 검토 반영)
      # 열쇠 = 달 + 색인 만드는 코드(sources.mjs) — 규칙을 바꿔 판(INDEX_VERSION)을 올린 날 다시 만든 색인도 새 열쇠로 저장된다
      - id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .data/words-src/index.json
          key: words-src-${{ steps.month.outputs.m }}-${{ hashFiles('scripts/words/sources.mjs') }}
          restore-keys: words-src-
      - name: news.mjs (넣은 단어 · 뉴스 · 새 단어 · 순서)
        id: news
        run: node scripts/words/news.mjs $DRY
      - name: review.mjs (카드 검토)
        if: always() && steps.health.outcome == 'success'
        run: node scripts/words/review.mjs $DRY
      # 찾기 규칙으로 못 찾는 예문 속 표제어 낱말(분리동사 · 불규칙 꼴)을 AI 로 적어 둔다(기획 v8 W1)
      - name: hits.mjs (예문 속 낱말)
        if: always() && steps.health.outcome == 'success'
        run: node scripts/words/hits.mjs $DRY
      # 색인을 실제로 새로 만든 날에만(news.mjs 가 rebuilt=1). 다시 만들기가 실패해 지난 색인이 남은 날은 저장하지 않는다
      - name: 색인 캐시 저장(새로 만든 날만)
        if: always() && steps.news.outputs.rebuilt == '1'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .data/words-src/index.json
          key: words-src-${{ steps.month.outputs.m }}-${{ hashFiles('scripts/words/sources.mjs') }}
