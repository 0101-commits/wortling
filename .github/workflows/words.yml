# 매일 단어 작업(카드 검토 · 뉴스 단어 · 내가 넣은 단어 · 학습 순서)을 깃허브 서버에서 — PC 가 꺼져 있어도 돈다.
# 07:30 아침 알림 전에 오늘 볼 카드를 검토해 두려고 05:17 KST. 그림 작업(daily.yml 12:17)과 안 겹친다.
# 설계 docs/superpowers/specs/2026-10-15-word-review-news-design.md
# 비밀값: APP_URL · API_TOKEN · GEMINI_API_KEY · DISCORD_WEBHOOK_URL (daily.yml 과 같음)
# 색인(.data/words-src/index.json)은 Actions 캐시에 달마다. 공개 저장소라 아무것도 커밋하지 않는다.
name: words

on:
  schedule:
    - cron: '17 20 * * *' # 한국 05:17
  workflow_dispatch:
    inputs:
      dry:
        description: '서버에 쓰지 않고 수만(--dry)'
        type: boolean
        default: false

concurrency: words

permissions:
  contents: read

jobs:
  words:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_URL: ${{ secrets.APP_URL }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      NEWS_FEEDS: ${{ vars.NEWS_FEEDS }} # 저장소 변수 NEWS_FEEDS=0 이면 tagesschau·NDR 을 읽지 않는다
      DRY: ${{ inputs.dry && '--dry' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: month
        run: echo "m=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      # 복원과 저장을 나눈다 — actions/cache 하나로는 작업이 실패하면(검토 묶음 하나만 실패해도) 새 색인이 저장되지 않아
      # 다음 날 원본 ≈170MB 를 다시 받았다(최종 검토 반영)
      # 열쇠 = 달 + 색인 만드는 코드(sources.mjs) — 규칙을 바꿔 판(INDEX_VERSION)을 올린 날 다시 만든 색인도 새 열쇠로 저장된다
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: .data/words-src/index.json
          key: words-src-${{ steps.month.outputs.m }}-${{ hashFiles('scripts/words/sources.mjs') }}
          restore-keys: words-src-
      - name: news.mjs (넣은 단어 · 뉴스 · 새 단어 · 순서)
        id: news
        run: node scripts/words/news.mjs $DRY
      - name: review.mjs (카드 검토)
        if: always()
        run: node scripts/words/review.mjs $DRY
      # 색인을 실제로 새로 만든 날에만(news.mjs 가 rebuilt=1). 다시 만들기가 실패해 지난 색인이 남은 날은 저장하지 않는다
      - name: 색인 캐시 저장(새로 만든 날만)
        if: always() && steps.news.outputs.rebuilt == '1'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .data/words-src/index.json
          key: words-src-${{ steps.month.outputs.m }}-${{ hashFiles('scripts/words/sources.mjs') }}
