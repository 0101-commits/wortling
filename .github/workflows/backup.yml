# 매일 03:00 KST(18:00 UTC) D1 을 내보내 backup/ 에 커밋한다(기획서 4-3 · 게이트 G9).
# 필요한 비밀: CLOUDFLARE_API_TOKEN(D1 읽기) · CLOUDFLARE_ACCOUNT_ID
name: backup-d1
on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: export
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p backup
          DAY=$(TZ=Asia/Seoul date +%F)
          npx wrangler d1 export wortling --remote --output=backup/$DAY.sql
          gzip -f backup/$DAY.sql
          ls -t backup/*.sql.gz | tail -n +31 | xargs -r rm --
      - name: commit
        run: |
          git config user.name 'wortling-backup'
          git config user.email 'backup@users.noreply.github.com'
          git add backup
          git diff --cached --quiet || git commit -m "backup: $(TZ=Asia/Seoul date +%F)"
          git push
